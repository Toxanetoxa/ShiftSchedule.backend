name: shiftschedule-production

services:
  app:
    image: ${APP_IMAGE:-shiftschedule-api:local}
    init: true
    env_file:
      - ${SERVER_ENV_FILE:-/etc/shiftschedule/app.env}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - app_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up', false, stream_context_create(['http' => ['timeout' => 3]])) === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shiftschedule}
      POSTGRES_USER: ${DB_USERNAME:-shiftschedule}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the server environment file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  app_storage:
  caddy_data:
  caddy_config:
