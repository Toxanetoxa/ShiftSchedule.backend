name: shiftschedule

# Local backend development environment. Start with: make up
services:
  app:
    container_name: backend
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    init: true
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8000}
      SCHEDULE_DEMO_MODE: ${SCHEDULE_DEMO_MODE:-true}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-shiftschedule}
      DB_USERNAME: ${DB_USERNAME:-shiftschedule}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      COMPOSER_ALLOW_SUPERUSER: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: "on-failure:3"

  db:
    container_name: postgres
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shiftschedule}
      POSTGRES_USER: ${DB_USERNAME:-shiftschedule}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGPORT: ${DB_PORT:-5432}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      # PostgreSQL 18 stores data in a versioned directory under this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h localhost -p \"$$PGPORT\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  vendor:
  postgres_data:
